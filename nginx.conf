server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/snippets/real-ip.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API requests go to the Fastify container
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append): a client-supplied X-Forwarded-For must never reach the API,
        # otherwise login rate limiting could be bypassed by faking the IP
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback so react-router routes (e.g. /login) work on refresh
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
