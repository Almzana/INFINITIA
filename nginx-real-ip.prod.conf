# Production only: nginx sits behind Caddy on the private Docker network and is not published to the
# host, so the only peer is Caddy. Trust its X-Forwarded-For (Caddy overwrites any value the client
# sent), otherwise every request would look like it came from Caddy and share one login rate limit.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
