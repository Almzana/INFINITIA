name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint
        run: npx oxlint src
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  api:
    name: API (typecheck, integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hrportal
          POSTGRES_PASSWORD: hrportal-ci
          POSTGRES_DB: hrportal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrportal -d hrportal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgres://hrportal:hrportal-ci@localhost:5432/hrportal_test
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Typecheck (src, scripts, test)
        run: npx tsc -p .
      - name: Integration tests (migrates and seeds the test database)
        run: npm test
