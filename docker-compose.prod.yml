# Production overrides. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# See DEPLOY.md for the .env values this needs.
services:
  db:
    # Not reachable from outside the Docker network at all
    ports: !reset []

  # Development mail catcher is not started in production
  mailpit:
    profiles: ["dev-only"]

  api:
    environment:
      RUN_SEED: "false"
      COOKIE_SECURE: "true"
      # API docs stay private on the public site unless you opt in
      API_DOCS: ${API_DOCS_PROD:-false}
      APP_URL: https://${DOMAIN:?Set DOMAIN in .env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env (company mail server)}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    depends_on: !override
      db:
        condition: service_healthy

  web:
    # Only Caddy talks to nginx
    ports: !reset []
    volumes:
      - ./nginx-real-ip.prod.conf:/etc/nginx/snippets/real-ip.conf:ro

  caddy:
    image: caddy:2.8-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  backup:
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-hrportal}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-hrportal}
      TZ: Asia/Bangkok
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
