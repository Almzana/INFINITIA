# Included in every location block (add_header in a location replaces the server-level ones).
# Inline styles are allowed because React sets style="" attributes; scripts are same-origin only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Enable once the site is served over HTTPS (browsers ignore it on plain HTTP):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
